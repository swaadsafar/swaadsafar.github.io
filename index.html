<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swaad Safar - Indian Khane ki Kahani</title>
<style>
:root{--bg:#f6f1f3;--card:#fff;--ink:#2a1a22;--mute:#6f5a64;--head:#4a1230;--acc:#f2a104;--line:#e6dbe0;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1016;--card:#27171f;--ink:#f3e9ee;--mute:#b9a3ae;--head:#2d0b1e;--line:#3d2832;--chip:#27171f}}
:root[data-theme="dark"]{--bg:#1a1016;--card:#27171f;--ink:#f3e9ee;--mute:#b9a3ae;--head:#2d0b1e;--line:#3d2832;--chip:#27171f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:#fff;padding:28px 18px 22px;border-bottom:6px solid var(--acc)}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0;font:800 clamp(2rem,8vw,3rem)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.5px}
header p{margin:8px 0 0;color:#e9d3de;max-width:46ch}
main{padding:16px 14px 40px}
#q{width:100%;padding:13px 14px;font-size:1rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#q:focus,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.chip{flex:none;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.94rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#2a1a22;font-weight:700}
#count{color:var(--mute);font-size:.88rem;margin:6px 2px 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details[open]{border-color:var(--acc)}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.em{font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:var(--bg);border-radius:50%;flex:none}
.nm{font-weight:700;font-size:1.06rem}
.sub{color:var(--mute);font-size:.85rem}
.body{padding:2px 16px 16px}
.body h3{margin:14px 0 4px;font-size:.94rem;color:var(--head)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .body h3{color:var(--acc)}}
:root[data-theme="dark"] .body h3{color:var(--acc)}
.body p,.body ol{margin:0}
.body ol{padding-left:20px}
.body li{margin:3px 0}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.tools{display:flex;gap:8px;margin-top:14px}
.tool{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
.fav{margin-left:auto;background:none;border:0;color:var(--acc);font-size:1.7rem;line-height:1;min-width:44px;min-height:44px;cursor:pointer}
summary>span:nth-child(2){min-width:0}
footer{text-align:center;color:var(--mute);font-size:13.5px;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Swaad Safar</h1>
<p>Kisi bhi Indian dish ki history, recipe aur kaha sabse famous hai, ek jagah.</p>
<div class="tools"><button class="tool" id="th" aria-label="Dark ya light mode">Dark mode</button><button class="tool" id="fs" aria-label="Bada font">A+ Bada font</button></div>
</div></header>
<main><div class="wrap">
<input id="q" type="search" placeholder="Dish ka naam likho... (jaise dosa)" aria-label="Dish search">
<div class="chips" id="chips"></div>
<div id="count"></div>
<div id="list"></div>
</div></main>
<footer>Photo se dish pehchanne wala feature jald aayega.</footer>
<script>
// [naam, emoji, tag, history, recipe steps (| se alag), kaha famous]
const D=[
["Butter Chicken","🍗","N","Delhi ke Moti Mahal (Daryaganj) me 1940s me Kundan Lal Gujral ke kitchen se aaya. Bache tandoori chicken ko tamatar-makhan ki gravy me daala gaya.","Chicken ko dahi-masale me marinate karke grill karo|Pan me makhan, tamatar puree, kaju paste, kasuri methi pakao|Chicken daalo, cream aur thodi cheeni milao|5 min dhimi aanch pe pakao","Delhi (Daryaganj), poore North India me"],
["Hyderabadi Biryani","🍚","S","Nizam aur Mughal kitchens me bani. Dum lagakar pakane ka tareeka Hyderabad ki pehchaan hai.","Gosht ko dahi aur masale me marinate karo|Basmati chawal 70% ubaal lo|Pot me gosht, upar chawal, fried pyaaz, kesar-doodh, pudina|Aate se seal karke dhimi aanch pe 30-40 min dum do","Hyderabad"],
["Masala Dosa","🥞","S","Karnataka ke Udupi restaurants ne ise poore India me mashhoor kiya.","Chawal aur urad dal (4:1) bhigo kar pees lo, 8-10 ghante ferment karo|Tawe pe patla failao, ghee lagao|Aloo-pyaaz ki sabzi (rai, curry patta, haldi) bharo|Mod kar chutney aur sambar ke saath do","Bengaluru, Udupi, Chennai"],
["Samosa","🥟","N","Central Asia ke 'sambosa' se nikla aur vyapariyon ke saath India aaya. Aloo wali filling baad me juri.","Maida me ajwain, ghee, namak daal kar aata goondo|Aloo, matar, jeera, dhaniya, garam masala ki filling banao|Cone banakar bharo aur kinare band karo|Medium tel me golden hone tak talo","North India, khaaskar Delhi aur UP"],
["Pav Bhaji","🍅","W","Kaha jaata hai 1850s me Mumbai ke mill mazdooron ke liye jaldi banne wale lunch ke roop me shuru hua.","Aloo, matar, gobhi, shimla mirch ubaal kar mash karo|Tawe pe makhan, pyaaz, tamatar, pav bhaji masala pakao|Sabzi daal kar dabate hue pakao|Makhan me senke pav ke saath do","Mumbai (Juhu, Chowpatty)"],
["Vada Pav","🍔","W","Mumbai ka 'garib ka burger'. Kaha jaata hai 1966 me Dadar ke paas Ashok Vaidya ne shuru kiya.","Aloo mash me hari mirch, lehsun, adrak, haldi milao|Gole banakar besan ke ghol me dubo kar talo|Pav me lehsun-mirch chutney lagao|Vada rakh kar serve karo","Mumbai"],
["Chole Bhature","🫓","N","Punjabi khana hai jo Delhi me bahut mashhoor hua. Kaha jaata hai Partition ke baad Punjabi log ise Delhi me popular kar gaye.","Chole raat bhar bhigo kar chai-patti ke saath ubaalo|Pyaaz-tamatar masala aur chole masala me pakao|Maida-dahi ka aata 2 ghante dhak kar rakho|Bele aur garam tel me fulao","Delhi, Amritsar"],
["Rajma Chawal","🫘","N","Rajma Americas se aaya (Portuguese ke raaste). Punjab aur Jammu ke gharon ka comfort food ban gaya.","Rajma raat bhar bhigo kar cooker me pakao|Pyaaz, tamatar, adrak, lehsun ka masala bhuno|Rajma daal kar 15 min ubaalo|Garam chawal ke saath serve karo","Punjab, Jammu, Delhi ke ghar"],
["Dal Baati Churma","🍲","W","Rajasthan ka khana, Mewar ke yoddhaon se juda mana jaata hai. Baati kande ki aag me sekte the.","Aata, suji, ghee, ajwain se baati ke gole banao|Oven ya kande pe 30-40 min sekho, phir ghee me dubao|Panchmel dal ko tadke ke saath pakao|Baati todkar dal aur churma (meetha) ke saath do","Jodhpur, Jaipur, Chittorgarh"],
["Dhokla","🟨","W","Gujarat ka steamed snack, fermented besan ke ghol se banta hai.","Besan, dahi, pani ka ghol 15 min rakho|Adrak-mirch paste, haldi, Eno daalo|Thali me daal kar 12-15 min bhaap do|Rai-curry patta ka tadka lagao","Surat, Ahmedabad"],
["Rasgulla","⚪","M","1868 me Kolkata ke Nobin Chandra Das ne mashhoor kiya. Odisha (Pahala) ka bhi apna daawa hai.","Doodh phaad kar chhena nikalo|Chhena 10 min masalo aur chhote gole banao|Cheeni ki chaashni me 15-20 min ubaalo|Thanda karke serve karo","Kolkata, Pahala (Odisha)"],
["Jalebi","🟠","M","West Asia ki 'zalabiya' se aayi aur madhyakaal me India me popular hui.","Maida aur dahi ka ghol ferment karo|Kapde ya bottle se garam ghee/tel me gol ghumao|Golden hone par nikaalo|Kesar wali chaashni me 30 sec dubo","Indore, Old Delhi, Jaipur"],
["Idli Sambar","⚪","S","Kuch log isse Indonesia se jodte hain, kuch South ki purani parampara maante hain. Roz ka nashta.","Idli chawal aur urad dal bhigo kar pees lo, raat bhar ferment karo|Idli stand me ghol daalo|10-12 min bhaap do|Sambar aur nariyal chutney ke saath do","Tamil Nadu, Karnataka"],
["Indori Poha","🍛","W","Poha purana khana hai. Indore ne ise jeera, sev aur jalebi ke saath alag pehchaan di.","Poha dho kar 5 min chhod do|Tel me rai, curry patta, pyaaz, haldi tadko|Poha milao, namak aur thodi cheeni daalo|Nimbu, sev, dhaniya aur jalebi ke saath do","Indore (Madhya Pradesh)"],
["Litti Chokha","🔥","E","Bihar (Magadh) ka khana. Kaha jaata hai 1857 me sainikon ka bhi khana tha.","Sattu, ajwain, pyaaz, nimbu ki filling banao|Aate ke goley me bharo|Kande ya oven me sek kar ghee lagao|Bhune baingan-aloo-tamatar ka chokha banao","Patna, Bihar"],
["Kachori","🥟","W","Rajasthan ki snack parampara se. Marwari vyapariyon ke saath poore India me phaili.","Maida me moyan daal kar aata goondo|Pyaaz ya moong dal ki masaledar filling bharo|Bele aur dhimi aanch pe tel me talo|Chutney ke saath garam garam do","Jodhpur, Jaipur"],
["Paneer Tikka","🧀","N","Tandoor ki parampara Punjab me purani hai. Paneer tikka aadhunik hai, 1970s ke baad popular hua mana jaata hai.","Paneer, shimla mirch, pyaaz ke tukde karo|Dahi, besan, masale me 30 min marinate karo|Seekh, tawe ya oven pe sek lo|Chaat masala, nimbu aur pudina chutney ke saath do","Punjab, Delhi"],
["Gulab Jamun","🟤","M","Mughal-Persian mithai parampara se. Khoya ke gole tal kar chaashni me dubote hain.","Khoya, thoda maida, elaichi se aata goondo|Smooth gole banao|Dhimi aanch pe golden talo|Garam chaashni me 1 ghanta dubo","Poore India, Mathura, Delhi"],
["Haleem","🥣","S","Arab 'harees' se Hyderabad ke Nizam ke daur me badla. Ramzan me khaas banta hai.","Gehu, dal, jau aur mutton ko ghante bhar pakao|Ghot kar ek saar karo|Upar se fried pyaaz aur garam masala daalo|Nimbu, adrak, hari mirch se sajao","Hyderabad (Ramzan me)"],
["Rogan Josh","🍖","N","Kashmir ka khana, Persian asar aur Mughal daur se popular. Kashmiri mirch se laal rang aata hai.","Mutton ko dahi, saunf, sonth, Kashmiri mirch me marinate karo|Sarson tel me hing, laung, elaichi daalo|Mutton ko dhimi aanch pe 1 se 1.5 ghanta pakao|Chawal ya roti ke saath do","Srinagar, Kashmir"],
["Puran Poli","🫓","M","Maharashtra ka tyohar ka khana (Gudi Padwa, Holi). Chana dal aur gud ki meethi bharti hoti hai.","Chana dal ubaal kar gud aur elaichi ke saath pakao|Mash karke puran banao|Aate ki loi me puran bhar kar bele|Tawe pe ghee se senko","Pune, Maharashtra"],
["Aloo Paratha","🫓","N","Punjab ke gharon ka sardiyon wala nashta. Amritsar ke dhabe iske liye mashhoor hain.","Aloo mash me hari mirch, anardana, namak milao|Aate ki loi me bharo|Bele aur tawe pe ghee se dono taraf senko|Dahi aur achaar ke saath do","Amritsar, Delhi (Paranthe Wali Gali)"],
["Kulfi","🍦","M","Mughal daur ki thandi mithai. Doodh ko ghante bhar ubaal kar gaadha karke jamate hain.","Doodh ko aadha hone tak pakao|Cheeni, elaichi, pista milao|Matke ya mould me daal kar 6-8 ghante jamao|Kaat kar serve karo","Delhi, Lucknow"],
["Goan Fish Curry","🐟","W","Goa ki curry, Portuguese aur local asar ka mel. Nariyal aur kokum ka khatta-meetha swaad.","Nariyal, mirch, haldi, jeera pees kar masala banao|Kokum aur pyaaz daal kar ubaalo|Machhli daal kar 8-10 min pakao|Chawal ke saath do","Goa"]
];
const T=[["all","Sab"],["N","North"],["S","South"],["E","East"],["W","West"],["M","Meetha"],["F","★ Saved"]];
const R={N:"North",S:"South",E:"East",W:"West",M:"Meetha"};
const $=id=>document.getElementById(id);
let tag="all";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let fav=new Set();try{fav=new Set(JSON.parse(ls.get("ss_fav")||"[]"))}catch(e){}
const root=document.documentElement;
function applyPrefs(){const t=ls.get("ss_theme");if(t)root.dataset.theme=t;if(ls.get("ss_big")==="1")root.style.fontSize="118%";label();}
function isDark(){const t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function label(){$("th").textContent=isDark()?"Light mode":"Dark mode";$("fs").textContent=ls.get("ss_big")==="1"?"A- Chhota font":"A+ Bada font"}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("chips").innerHTML=T.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="${t[0]==="all"}">${t[1]}</button>`).join("");
function render(){
  const q=$("q").value.trim().toLowerCase();
  const r=D.filter(d=>(tag==="all"||(tag==="F"?fav.has(d[0]):d[2]===tag))&&(!q||(d[0]+" "+d[5]).toLowerCase().includes(q)));
  $("count").textContent=r.length+" dishes";
  $("list").innerHTML=r.length?r.map(d=>`<details><summary><span class="em">${d[1]}</span><span><div class="nm">${esc(d[0])}</div><div class="sub">${R[d[2]]} · ${esc(d[5])}</div></span><button class="fav" data-n="${esc(d[0])}" aria-pressed="${fav.has(d[0])}" aria-label="Save ${esc(d[0])}">${fav.has(d[0])?"★":"☆"}</button></summary><div class="body"><h3>History</h3><p>${esc(d[3])}</p><h3>Recipe</h3><ol>${d[4].split("|").map(s=>`<li>${esc(s)}</li>`).join("")}</ol><h3>Kaha sabse famous</h3><p>${esc(d[5])}</p></div></details>`).join(""):`<div class="empty">${tag==="F"?"Abhi koi dish save nahi ki. Kisi dish ke star pe tap karo.":"Ye dish abhi list me nahi hai."}</div>`;
}
$("q").addEventListener("input",render);
$("list").addEventListener("click",e=>{const b=e.target.closest(".fav");if(!b)return;e.preventDefault();e.stopPropagation();const n=b.dataset.n;fav.has(n)?fav.delete(n):fav.add(n);ls.set("ss_fav",JSON.stringify([...fav]));if(tag==="F")render();else{const on=fav.has(n);b.textContent=on?"★":"☆";b.setAttribute("aria-pressed",on);}});
$("th").addEventListener("click",()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;ls.set("ss_theme",t);label();});
$("fs").addEventListener("click",()=>{const big=ls.get("ss_big")==="1";ls.set("ss_big",big?"0":"1");root.style.fontSize=big?"":"118%";label();});
applyPrefs();
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;tag=b.dataset.t;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render();});
render();
</script>
</body>
</html>
