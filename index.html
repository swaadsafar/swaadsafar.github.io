["Butter Chicken","🍗","N","Delhi ke Moti Mahal (Daryaganj) me 1940s me Kundan Lal Gujral ke kitchen se aaya. Bache tandoori chicken ko tamatar-makhan ki gravy me daala gaya.","Chicken ko dahi-masale me marinate karke grill karo|Pan me makhan, tamatar puree, kaju paste, kasuri methi pakao|Chicken daalo, cream aur thodi cheeni milao|5 min dhimi aanch pe pakao","Delhi (Daryaganj), poore North India me"],

["Surti Locho","🥞","W","Surat ka narm snack, khaman ka bhura roop. Ghol ko bhaap me pakate hain aur toote hue ghol ki tarah dikhta hai.","Chana dal aur chawal ka ghol ferment karo|Thali me bhaap me narm pakao|Todkar tel, sev, pyaaz aur masala daalo|Chutney ke saath do","Surat"],
["Sev Tameta","🍅","W","Gujarat ki jaldi banne wali sabzi. Tamatar ki khatti-meethi gravy me sev dalte hain.","Tel me rai, hing, haldi aur tamatar pakao|Cheeni aur masale milao|Gravy gaadhi hone par kuchh der pakao|Parosne se pehle sev daalo","Gujarat (Saurashtra)"],
["Misal Pav","🌶️","W","Maharashtra ka mashhoor nashta. Ankurit moth ki masaledar gravy, upar farsan, pav ke saath. Kolhapur, Pune aur Nashik ki alag-alag kisme hain.","Moth ka ankur ubaal kar pakao|Pyaaz, nariyal, masale ka teekha 'kat' banao|Moth upar daalkar kat daalo|Farsan, pyaaz, nimbu aur pav ke saath do","Kolhapur, Pune, Nashik"],
["Sabudana Khichdi","🍚","W","Maharashtra ka vrat ka khana. Sabudana, moongfali aur aloo se bana halka khana.","Sabudana ko 4-5 ghante bhigo kar pani nikaal do|Ghee me jeera, hari mirch, aloo bhuno|Kuti moongfali aur sabudana milao|Dhimi aanch pe pakao, nimbu daalo","Maharashtra (vrat me)"],
["Bombay Sandwich","🥪","W","Mumbai ki street sandwich. Chutney, ubaali sabzi aur masale ke saath, kai baar grill karke milti hai.","Bread pe hari chutney aur makhan lagao|Aloo, chukandar, kheera, tamatar ki parat lagao|Chaat masala chhidko|Grill karke ya seedha kaat kar do","Mumbai"],
["Thalipeeth","🫓","W","Maharashtra ka multigrain parantha, jisme bhajani ka aata hota hai. Nashte ya vrat me khaya jaata hai.","Bhajani aata, pyaaz, dhaniya aur masale se aata goondo|Haath se tawe pe thaapo, beech me chhed karo|Tel lagakar dono taraf sek lo|Dahi ya makhan ke saath do","Maharashtra"],
["Bharli Vangi","🍆","W","Maharashtra ki bharwa baingan. Nariyal-moongfali ke masale se bhare chhote baingan.","Moongfali, nariyal, til aur masale ka masala bhuno|Chhote baingan me cheera laga kar masala bharo|Tel me dhimi aanch pe dhak kar pakao|Bhakri ke saath do","Maharashtra"],
["Kolhapuri Chicken","🍗","W","Kolhapur ki teekhi chicken gravy, jo apne laal tikhe masale ke liye mashhoor hai.","Chicken ko adrak-lehsun me marinate karo|Sukhe nariyal, khus-khus aur lal mirch ka masala bhuno|Chicken daal kar dhimi aanch pe pakao|Bhakri ya chawal ke saath do","Kolhapur"],
["Sol Kadhi","🥛","W","Konkan aur Goa ka thanda peya. Kokum aur nariyal ke doodh se bana, khane ko hazam karne me madad karta hai.","Kokum ko pani me bhigo kar ras nikalo|Nariyal ka doodh, lehsun aur hari mirch milao|Namak daalo|Thanda karke gilaas me parosiye","Konkan, Goa"],
["Zunka Bhakar","🍛","W","Maharashtra ka gaon wala khana. Besan ki sookhi sabzi aur jowar ki bhakri.","Tel me rai, jeera, lehsun, pyaaz bhuno|Besan ka ghol daalo aur halka sookha hone tak pakao|Hari mirch aur haldi milao|Garam bhakri aur thecha ke saath do","Maharashtra"],
["Kanda Bhaji","🧅","W","Maharashtra ke baarish ke mausam ke pakode. Bareek kate pyaaz besan me lapet kar talte hain.","Pyaaz bareek kaat kar namak se naram karo|Besan, haldi, mirch, ajwain milao|Chhote chhote pakode banao|Garam tel me golden talo","Maharashtra, Mumbai"],
["Bhel Puri","🥗","W","Mumbai ki mashhoor chaat, jo Chowpatty beach se jaani jaati hai. Murmura, sev, aloo aur chutneyon ka mel.","Murmura, sev, bareek pyaaz aur tamatar milao|Imli aur hari chutney daalo|Papdi aur ubaala aloo milao|Turant parosiye warna nami se naram ho jayegi","Mumbai (Chowpatty)"],
["Ragda Pattice","🥔","W","Mumbai ki chaat. Aloo ki tikki aur safed matar ka ragda, upar se chutney.","Safed matar ubaal kar halki gravy banao|Aloo ki tikki sek lo|Tikki par ragda daalo|Pyaaz, sev, imli aur hari chutney se sajao","Mumbai"],
["Pithla Bhakri","🫓","W","Maharashtra ka simple gaon ka khana. Besan ka pithla aur jowar ki bhakri.","Besan ko pani me ghol lo|Tel me rai, lehsun, pyaaz ka tadka lagao|Ghol daal kar gaadha hone tak pakao|Bhakri aur thecha ke saath do","Maharashtra"],
["Gatte ki Sabzi","🥘","W","Rajasthan ka khana, jab sabziyan kam hoti thi to besan ke gatte dahi ki gravy me banaye jate the.","Besan, ajwain, masale se aata goondo|Lambi lambi roll banakar ubaal lo|Dahi, besan aur masale ki gravy banao|Gatte tukde karke gravy me pakao","Rajasthan"],
["Laal Maas","🌶️","W","Rajasthan ka teekha mutton. Kaha jaata hai ye Rajput shikari parampara se juda hai. Mathania mirch se laal rang aata hai.","Mutton ko dahi aur lehsun me marinate karo|Ghee me lal mirch aur masale bhuno|Mutton daal kar dhimi aanch pe pakao|Roti ya bajre ki roti ke saath do","Jodhpur, Jaipur"],
["Ker Sangri","🌿","W","Rajasthan ke registan ki sukhi sabzi. Ker (berry) aur sangri (phali) sukhakar rakhi jaati hain.","Ker aur sangri raat bhar bhigo kar ubaalo|Tel me hing, jeera aur sukhi mirch ka tadka|Ker-sangri daal kar masale milao|Dahi ya chhach me thoda pakao","Rajasthan (Jodhpur, Bikaner)"],
["Mirchi Vada","🌶️","W","Rajasthan ki teekhi snack. Moti mirch me aloo bhar kar besan me talte hain. Jodhpur ka mirchi vada mashhoor hai.","Moti mirch me cheera lagao|Aloo masala bharo|Besan ke ghol me dubo kar talo|Imli chutney ke saath do","Jodhpur"],
["Bikaneri Bhujia","🍜","W","Bikaner ki namkeen. Moth aur besan se bani patli sev. Bikaner is wajah se namkeen ke liye mashhoor hai.","Moth ka aata, besan, masale se aata goondo|Sev ke saancha me bhar kar garam tel me daalo|Dhimi aanch pe sunhera hone tak talo|Thanda karke dibbe me rakho","Bikaner"],
["Vindaloo","🍖","W","Goa ka khana, Portuguese 'carne de vinha d'alhos' (siraka aur lehsun me marinate meat) se nikla. Goa me asli roop sooar ke gosht se banta hai.","Gosht ko siraka, lehsun, adrak aur masale me raat bhar marinate karo|Pyaaz bhuno aur marinate daalo|Dhimi aanch pe 1 ghanta pakao|Chawal ya pav ke saath do","Goa"],
["Xacuti","🍛","W","Goa ki nariyal aur bhune masalon wali gravy. Kai tarah ke masale bhoon kar pees lete hain.","Sukhe nariyal aur sabut masale bhuno|Pees kar paste banao|Pyaaz, adrak-lehsun bhuno, chicken daalo|Paste milakar dhimi aanch pe pakao","Goa"],
["Prawn Balchao","🦐","W","Goa ka teekha-khatta achaar jaisa prawn masala. Siraka aur lal masale se bana, kuch din tak rakh sakte hain.","Jhinge ko saaf karke namak-haldi lagao|Lal mirch, siraka, lehsun ka masala pees lo|Tel me jhinge halka tal kar masala me pakao|Thanda karke pav ya chawal ke saath do","Goa"],
["Bhutte ka Kees","🌽","W","Indore (Madhya Pradesh) ka khana. Kaddukas ki hui bhutta aur doodh se bana, baarish me khaaskar.","Bhutte kaddukas karo|Ghee me jeera, hari mirch, adrak bhuno|Bhutta daal kar doodh milao|Dhimi aanch pe pakao, nimbu aur nariyal chhidko","Indore"]
];
const T=[["all","Sab"],["N","North"],["S","South"],["E","East"],["W","West"],["M","Meetha"],["F","★ Saved"]];
const R={N:"North",S:"South",E:"East",W:"West",M:"Meetha"};
const $=id=>document.getElementById(id);
let tag="all";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let fav=new Set();try{fav=new Set(JSON.parse(ls.get("ss_fav")||"[]"))}catch(e){}
const root=document.documentElement;
function applyPrefs(){const t=ls.get("ss_theme");if(t)root.dataset.theme=t;if(ls.get("ss_big")==="1")root.style.fontSize="118%";label();}
function isDark(){const t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function label(){$("th").textContent=isDark()?"Light mode":"Dark mode";$("fs").textContent=ls.get("ss_big")==="1"?"A- Chhota font":"A+ Bada font"}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("chips").innerHTML=T.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="${t[0]==="all"}">${t[1]}</button>`).join("");
function render(){
  const q=$("q").value.trim().toLowerCase();
  const r=D.filter(d=>(tag==="all"||(tag==="F"?fav.has(d[0]):d[2]===tag))&&(!q||(d[0]+" "+d[5]).toLowerCase().includes(q)));
  $("count").textContent=r.length+" dishes";
  $("list").innerHTML=r.length?r.map(d=>`<details><summary><span class="em">${d[1]}</span><span><div class="nm">${esc(d[0])}</div><div class="sub">${R[d[2]]} · ${esc(d[5])}</div></span><button class="fav" data-n="${esc(d[0])}" aria-pressed="${fav.has(d[0])}" aria-label="Save ${esc(d[0])}">${fav.has(d[0])?"★":"☆"}</button></summary><div class="body"><h3>History</h3><p>${esc(d[3])}</p><h3>Recipe</h3><ol>${d[4].split("|").map(s=>`<li>${esc(s)}</li>`).join("")}</ol><h3>Kaha sabse famous</h3><p>${esc(d[5])}</p></div></details>`).join(""):`<div class="empty">${tag==="F"?"Abhi koi dish save nahi ki. Kisi dish ke star pe tap karo.":"Ye dish abhi list me nahi hai."}</div>`;
}
$("q").addEventListener("input",render);
$("list").addEventListener("click",e=>{const b=e.target.closest(".fav");if(!b)return;e.preventDefault();e.stopPropagation();const n=b.dataset.n;fav.has(n)?fav.delete(n):fav.add(n);ls.set("ss_fav",JSON.stringify([...fav]));if(tag==="F")render();else{const on=fav.has(n);b.textContent=on?"★":"☆";b.setAttribute("aria-pressed",on);}});
$("th").addEventListener("click",()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;ls.set("ss_theme",t);label();});
$("fs").addEventListener("click",()=>{const big=ls.get("ss_big")==="1";ls.set("ss_big",big?"0":"1");root.style.fontSize=big?"":"118%";label();});
applyPrefs();
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;tag=b.dataset.t;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render();});
render();
</script>
</body>
</html>
